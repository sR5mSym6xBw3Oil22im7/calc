<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON BURST CALCULATOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora aurora-one"></div>
  <div class="aurora aurora-two"></div>
  <div class="grid-overlay"></div>
  <canvas id="particleCanvas" aria-hidden="true"></canvas>
  <canvas id="fireworksCanvas" aria-hidden="true"></canvas>

  <main class="app-shell">
    <section class="calculator" id="calculator" aria-label="派手な電卓">
      <div class="calculator-glow"></div>

      <header class="calculator-header">
        <div>
          <p class="eyebrow">MAXIMUM EFFECT MODE</p>
          <h1>NEON BURST</h1>
        </div>
      </header>

      <div class="display-panel" id="displayPanel">
        <div class="display-scanline"></div>
        <output class="expression-display" id="expressionDisplay" aria-label="計算履歴"></output>
        <output class="main-display" id="mainDisplay" aria-live="polite">0</output>
        <div class="display-meter"><span id="displayMeterBar"></span></div>
      </div>

      <section class="voice-panel" id="voicePanel" aria-label="音声入力">
        <div class="voice-header">
          <span class="voice-title">VOICE INPUT</span>
          <span class="voice-state" id="voiceState">READY</span>
        </div>
        <button
          class="voice-button"
          id="voiceButton"
          type="button"
          aria-label="音声入力を開始"
          aria-pressed="false"
        >
          <span aria-hidden="true">🎙</span>
          <span id="voiceButtonLabel">音声入力</span>
        </button>
        <p class="voice-status" id="voiceStatus" role="status" aria-live="polite">
          マイクを押して話してください
        </p>
        <p class="voice-hint">例: 「12たす3イコール」</p>
        <output class="voice-transcript" id="voiceTranscript" aria-label="認識結果">認識: —</output>
      </section>

      <div class="keypad" id="keypad">
        <button class="key utility" type="button" data-action="clear"><span>AC</span></button>
        <button class="key utility" type="button" data-action="backspace"><span>DEL</span></button>
        <button class="key utility" type="button" data-action="percent"><span>%</span></button>
        <button class="key operator" type="button" data-operator="/"><span>÷</span></button>

        <button class="key number" type="button" data-number="7"><span>7</span></button>
        <button class="key number" type="button" data-number="8"><span>8</span></button>
        <button class="key number" type="button" data-number="9"><span>9</span></button>
        <button class="key operator" type="button" data-operator="*"><span>×</span></button>

        <button class="key number" type="button" data-number="4"><span>4</span></button>
        <button class="key number" type="button" data-number="5"><span>5</span></button>
        <button class="key number" type="button" data-number="6"><span>6</span></button>
        <button class="key operator" type="button" data-operator="-"><span>−</span></button>

        <button class="key number" type="button" data-number="1"><span>1</span></button>
        <button class="key number" type="button" data-number="2"><span>2</span></button>
        <button class="key number" type="button" data-number="3"><span>3</span></button>
        <button class="key operator" type="button" data-operator="+"><span>＋</span></button>

        <button class="key number zero" type="button" data-number="0"><span>0</span></button>
        <button class="key number" type="button" data-action="decimal"><span>.</span></button>
        <button class="key equals" type="button" data-action="equals"><span>=</span></button>
      </div>

      <footer class="keyboard-guide">Keyboard: 0-9 / + - * / / Enter / Esc / Backspace</footer>
    </section>
  </main>

  <div id="flashLayer" class="flash-layer" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
